name: Envoyer les liens

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/envoyer-liens.yml"

permissions:
  contents: write

jobs:
  envoyer:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Envoyer les liens
        run: python scripts/envoyer_liens.py

      - name: Sauvegarder le journal
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add log-url.txt

          if git diff --cached --quiet; then
            echo "Aucune modification du journal."
          else
            git commit -m "Mettre à jour le journal des URLs envoyées"
            git push
          fi
