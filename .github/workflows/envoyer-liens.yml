name: Envoyer les liens

on:
  # Exécution automatique tous les jours (en UTC).
  schedule:
    - cron: "0 0 * * *"

  # Exécution manuelle depuis l'interface GitHub Actions.
  workflow_dispatch:
    inputs:
      force_scan:
        description: "Forcer le scan de toutes les pages"
        required: false
        default: false
        type: boolean

# Empêche deux exécutions principales de fonctionner en même temps.
concurrency:
  group: envoyer-liens-main
  cancel-in-progress: false

# Autorise le workflow à modifier les fichiers du dépôt.
permissions:
  contents: write

jobs:
  envoyer:
    name: Exécuter le script
    runs-on: ubuntu-latest

    steps:
      # Récupération du dépôt.
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      # Installation de Python.
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Installation des dépendances Python.
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Exécution du script.
      #
      # Le secret est transmis uniquement à cette étape.
      #
      # L'option --force-scan est ajoutée uniquement lors d'une exécution manuelle lorsque la case est cochée.
      - name: Exécuter envoyer_liens.py
        env:
          KEEPSHARE_TOKEN: ${{ secrets.KEEPSHARE_TOKEN }}
        run: |
          if [ "${{ inputs.force_scan }}" = "true" ]; then
            echo "Mode forcé activé."
            python scripts/envoyer_liens.py --force-scan
          else
            echo "Mode forcé désactivé."
            python scripts/envoyer_liens.py
          fi

      # Sauvegarde des fichiers modifiés par le script.
      - name: Sauvegarder les journaux et les fichiers modifiés
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add liens-à-envoyer.txt
          git add pages-à-extraire.txt
          git add log-url/

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Mettre à jour les journaux et les pages à réessayer"

          for tentative in 1 2 3 4 5; do
            echo "Tentative de push ${tentative}/5"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Erreur : conflit pendant le rebase."
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push réussi."
              exit 0
            fi

            echo "Push refusé. Nouvelle tentative dans 10 secondes."
            sleep 10
          done

          echo "Impossible de pousser les modifications après 5 tentatives."
          exit 1
