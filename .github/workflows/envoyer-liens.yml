name: Envoyer les liens

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

concurrency:
  group: envoyer-liens-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  envoyer:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Envoyer les liens
        run: python scripts/envoyer_liens.py

      - name: Sauvegarder les journaux
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A log-url "liens-à-envoyer.txt"

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Mettre à jour les journaux des URLs envoyées"

          for tentative in 1 2 3; do
            echo "Tentative de push ${tentative}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Erreur : conflit pendant le rebase."
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push réussi."
              exit 0
            fi

            echo "Push refusé. Nouvelle tentative dans 5 secondes."
            sleep 5
          done

          echo "Impossible de pousser les modifications après 3 tentatives."
          exit 1
