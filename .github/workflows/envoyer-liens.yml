name: Envoyer les liens

on:
  schedule:
    - cron: "0 0 * * *" # Tous les jours à 00:00 UTC

  workflow_dispatch:

concurrency:
  group: envoyer-liens-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  envoyer:
    name: Exécuter le script
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
         python -m pip install --upgrade pip
         python -m pip install -r requirements.txt

      - name: Exécuter envoyer_liens.py
        run: |
          python scripts/envoyer_liens.py

      - name: Sauvegarder les journaux et les fichiers modifiés
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add liens-à-envoyer.txt
          git add bases-à-extraire.txt
          git add log-url/

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Mettre à jour les journaux et les pages à réessayer"

          for tentative in 1 2 3 4 5; do
            echo "Tentative de push ${tentative}/5"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Erreur : conflit pendant le rebase."
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push réussi."
              exit 0
            fi

            echo "Push refusé. Nouvelle tentative dans 10 secondes."
            sleep 10
          done

          echo "Impossible de pousser les modifications après 5 tentatives."
          exit 1
