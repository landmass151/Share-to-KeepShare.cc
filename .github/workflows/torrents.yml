name: Télécharger les torrents

on:
  schedule:
    # Exécution toutes les 4 heures, en UTC
    - cron: "0 */4 * * *"

  # Permet de lancer le workflow manuellement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    name: Télécharger les nouveaux torrents
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Télécharger les torrents
        run: |
          python download_torrents.py

      - name: Vérifier les changements
        id: changes
        run: |
          git add torrent/

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun nouveau fichier."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "De nouveaux fichiers ont été trouvés."
          fi

      - name: Committer les torrents
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Ajout des nouveaux torrents"
          git push
