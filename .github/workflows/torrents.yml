name: Télécharger les torrents

on:
  schedule:
    # 00:00 à Paris pendant l'heure d'été
    - cron: "0 22 * * *"

    # 00:00 à Paris pendant l'heure d'hiver
    - cron: "0 23 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Télécharger les nouveaux torrents
        run: python download_torrents.py

      - name: Enregistrer les nouveaux fichiers dans Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add torrent/

          if git diff --cached --quiet; then
            echo "Aucun nouveau torrent à commit."
          else
            git commit -m "Ajout des nouveaux torrents"
            git push
          fi
